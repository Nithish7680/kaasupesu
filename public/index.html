<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KaasuPesu prototype</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f5f2ec; --panel: #ffffff; --ink: #1c2320; --muted: #5d6a64; --line: #e2ddd2;
    --brand: #0d6b50; --on-brand: #ffffff; --mine: #d8f0e4; --chip: #eaf2ee; --warn: #8a5300; --live: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111614; --panel: #1a201e; --ink: #e7ece9; --muted: #9aa7a1; --line: #2b3431;
      --brand: #46b58f; --on-brand: #06140f; --mine: #1d3a2f; --chip: #22302b; --warn: #e2a64c; --live: #f97066;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; }
  .app { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding: 0 16px 16px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 0; flex-wrap: wrap; }
  .brand { font-weight: 700; }
  .meta { font-size: 0.8rem; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tabs { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  .tabs button { flex: 1; border: 0; background: transparent; color: var(--ink); padding: 8px; border-radius: 8px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--brand); color: var(--on-brand); }
  main { flex: 1; display: flex; flex-direction: column; gap: 10px; padding-top: 12px; }
  .chat { flex: 1; min-height: 40vh; max-height: 58vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 8px 2px; }
  .bubble { max-width: 85%; padding: 8px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); overflow-wrap: anywhere; }
  .bubble.owner { align-self: flex-end; background: var(--mine); border-color: transparent; }
  .bubble.bot { align-self: flex-start; }
  .gloss { display: block; font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
  .tag { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  .note { align-self: center; font-size: 0.8rem; color: var(--muted); margin: 0; text-align: center; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 999px; padding: 6px 10px; font-size: 0.85rem; cursor: pointer; max-width: 100%; text-align: left; }
  .composer { display: flex; gap: 6px; }
  .composer input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); font: inherit; }
  .composer input.attention { border-color: var(--warn); box-shadow: 0 0 0 2px var(--warn); }
  .composer button, .row button, .card button { border: 0; border-radius: 10px; padding: 10px 12px; background: var(--brand); color: var(--on-brand); cursor: pointer; }
  .composer button:disabled, .card button:disabled { opacity: 0.55; cursor: not-allowed; }
  .mic { white-space: nowrap; touch-action: none; user-select: none; -webkit-user-select: none; }
  .composer .mic.live { background: var(--live); }
  .hint { margin: 0; color: var(--warn); font-size: 0.85rem; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .card header { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .card p { margin: 0; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 0.9rem; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  .card .link { background: none; color: var(--brand); padding: 0; text-decoration: underline; align-self: flex-start; }
  .row .ghost { background: transparent; color: var(--brand); border: 1px solid var(--line); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .muted { color: var(--muted); }
  .small { font-size: 0.8rem; }
  .callhead { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  .turns { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .turn { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; overflow-wrap: anywhere; }
  .turn.buyer { background: var(--mine); border-color: transparent; }
  .time { border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 8px; padding: 2px 6px; font-size: 0.8rem; cursor: pointer; font-variant-numeric: tabular-nums; }
  .who { display: block; font-size: 0.75rem; color: var(--muted); }
  .status { font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; background: var(--chip); border: 1px solid var(--line); white-space: nowrap; }
  .s-promised, .s-paid { color: var(--brand); }
  .s-missed, .s-past-45-days, .s-disputed { color: var(--warn); }
  .wa { border-color: var(--brand); }
  .empty { color: var(--muted); }
  .toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); margin: 0; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 0.85rem; max-width: calc(100% - 32px); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div><span class="brand">KaasuPesu</span> <span class="muted small">prototype</span></div>
    <div class="meta">
      <span id="mode"></span>
      <span>Today: 20 Nov 2026</span>
      <button type="button" id="sound" class="chip" aria-pressed="true">Sound on</button>
    </div>
  </header>
  <nav class="tabs" role="tablist" aria-label="Screens">
    <button type="button" role="tab" data-tab="owner" aria-selected="true">Owner chat</button>
    <button type="button" role="tab" data-tab="call" aria-selected="false">Call</button>
    <button type="button" role="tab" data-tab="bills" aria-selected="false">Bills</button>
  </nav>
  <main id="screen"></main>
</div>
<p id="toast" class="toast" role="status" hidden></p>
<script type="module" src="/app.js"></script>
</body>
</html>
